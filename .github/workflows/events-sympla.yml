name: City Events (Sympla)

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      wayback_snapshots:
        description: 'Snapshots da listagem a consultar para backfill histórico (0 = só live)'
        required: false
        default: '0'
        type: string

permissions:
  contents: write

concurrency:
  group: city-events-sympla
  cancel-in-progress: false

jobs:
  collect:
    name: Collect public Porto Velho events
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Collect public Sympla events
        run: |
          WAYBACK="${{ inputs.wayback_snapshots }}"
          if [ -z "$WAYBACK" ]; then
            WAYBACK=0
          fi
          uv run scripts/events/collect_sympla.py --wayback-snapshots "$WAYBACK"

      - name: Validate event concepts
        run: |
          uv run okf-parser check specs
          if [ -d knowledge/events/events ]; then
            uv run okf-parser check knowledge/events/events
          fi
          if [ -d knowledge/events/observations ]; then
            uv run okf-parser check knowledge/events/observations
          fi

      - name: Persist changed observations
        run: |
          git config user.name "O Vigia Events Bot"
          git config user.email "actions@users.noreply.github.com"
          git add knowledge/events
          if git diff --cached --quiet; then
            echo "Nenhuma mudança material na agenda."
            exit 0
          fi
          git commit -m "data(events): update Sympla city agenda"
          git pull --rebase origin main
          git push origin HEAD:main
