name: CI / Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test, Schemas & OKF Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install locked dependencies including dev tooling
        run: uv sync --locked --all-extras --dev

      - name: Diagnose Ruff autofix
        run: |
          uv run ruff check . --fix || true
          uv run ruff format .
          git diff > ruff-autofix.patch

      - name: Upload Ruff autofix patch
        uses: actions/upload-artifact@v4
        with:
          name: ruff-autofix
          path: ruff-autofix.patch

      - name: Run Ruff Linter & Format Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Pytest Suite
        run: uv run pytest -v --cov=ovigia_dados

      - name: Validate DuckDB Schemas & SQL Contracts
        run: uv run scripts/validate_schemas.py

      - name: Validate OKF Bundle & Schemas
        run: uv run scripts/validate_okf.py
