name: City Events (Sesc Rondônia)

on:
  schedule:
    - cron: '17 11,23 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Páginas por arquivo público do Sesc a consultar'
        required: false
        default: '1'
        type: string

permissions:
  contents: write

concurrency:
  group: city-events-sesc
  cancel-in-progress: false

jobs:
  collect:
    name: Collect Sesc Porto Velho events
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Collect Sesc public events
        run: |
          PAGES="${{ inputs.pages }}"
          if [ -z "$PAGES" ]; then PAGES=1; fi
          uv run scripts/events/collect_sesc.py --pages "$PAGES"

      - name: Validate event concepts
        run: |
          uv run okf-parser check specs
          if [ -d knowledge/events/events ]; then
            uv run okf-parser check knowledge/events/events
          fi
          if [ -d knowledge/events/observations ]; then
            uv run okf-parser check knowledge/events/observations
          fi

      - name: Persist changed observations
        run: |
          git config user.name "O Vigia Events Bot"
          git config user.email "actions@users.noreply.github.com"
          git add knowledge/events
          if git diff --cached --quiet; then
            echo "Nenhuma mudança material na agenda do Sesc."
            exit 0
          fi
          git commit -m "data(events): update Sesc city agenda"
          git pull --rebase origin main
          git push origin HEAD:main
