name: Wayback Machine Preservation

on:
  push:
    branches: [main]
    paths:
      - "knowledge/wayback/requests/**/*.md"
      - "src/ovigia_dados/wayback/**"
      - "scripts/wayback/**"
      - ".github/workflows/wayback-save.yml"
  workflow_dispatch:

# Results and replay evidence are append-only writes to main. Serializing the
# worker prevents concurrent runs from generating the same replay paths and
# colliding during the persistence rebase.
concurrency:
  group: wayback-preservation-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  wayback-save:
    name: Drain OKF Wayback queue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate governed Wayback OKF namespace before preservation
        run: uv run scripts/wayback/check.py

      - name: Drain pending archive-request concepts
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual recovery: draining the full pending queue."
            uv run scripts/wayback/drain.py
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          worker_changed=false
          requests=()

          for path in "${changed[@]}"; do
            case "$path" in
              src/ovigia_dados/wayback/*|scripts/wayback/*|.github/workflows/wayback-save.yml)
                worker_changed=true
                ;;
              knowledge/wayback/requests/*.md)
                requests+=("$path")
                ;;
            esac
          done

          if [[ "$worker_changed" == "true" ]]; then
            echo "Wayback worker changed: retrying the full pending queue under the new implementation."
            uv run scripts/wayback/drain.py
          elif (( ${#requests[@]} > 0 )); then
            args=()
            for request in "${requests[@]}"; do
              args+=(--request-path "$request")
            done
            uv run scripts/wayback/drain.py "${args[@]}"
          else
            echo "No archive-request or worker changes in this push; preservation queue unchanged."
          fi

      - name: Validate governed Wayback OKF namespace after preservation
        run: uv run scripts/wayback/check.py

      - name: Materialize auditable replay evidence
        run: uv run scripts/wayback/replay.py

      - name: Decode stored text replay transport
        run: uv run scripts/wayback/text_replay.py

      - name: Compare PDF replay text with live source
        run: uv run scripts/wayback/pdf_equivalence.py

      - name: Persist archive results and replay evidence
        run: |
          set -euo pipefail
          git add knowledge/wayback/results raw/wayback/replays
          if git diff --cached --quiet -- knowledge/wayback/results raw/wayback/replays; then
            echo "No terminal Wayback results or new replay evidence produced."
            exit 0
          fi
          git config user.name "O Vigia Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(wayback): persist archive evidence from run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Archive evidence push raced with main; retrying ($attempt/3)." >&2
            sleep $((attempt * 2))
          done
          echo "Could not persist Wayback evidence after 3 rebases." >&2
          exit 1
