name: Wayback Machine Preservation

on:
  push:
    branches: [main]
    paths:
      - "knowledge/wayback/requests/**/*.md"
      - "src/ovigia_dados/wayback/**"
      - "scripts/wayback/**"
      - ".github/workflows/wayback-save.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wayback-preservation
  cancel-in-progress: false

jobs:
  wayback-save:
    name: Drain OKF Wayback queue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate OKF bundle before preservation
        run: uv run okf check .

      - name: Drain pending archive-request concepts
        run: uv run scripts/wayback/drain.py

      - name: Validate OKF bundle after preservation
        run: uv run okf check .

      - name: Persist terminal archive-result concepts
        run: |
          set -euo pipefail
          if git diff --quiet -- knowledge/wayback/results; then
            echo "No terminal Wayback results produced; requests remain pending."
            exit 0
          fi
          git config user.name "O Vigia Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add knowledge/wayback/results
          git commit -m "chore(wayback): persist archive results from run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Result push raced with main; retrying ($attempt/3)." >&2
            sleep $((attempt * 2))
          done
          echo "Could not persist Wayback results after 3 rebases." >&2
          exit 1
