name: Wayback Machine Preservation

on:
  push:
    branches: [main]
    paths:
      - "knowledge/wayback/requests/**/*.md"
      - "src/ovigia_dados/wayback/**"
      - "scripts/wayback/**"
      - ".github/workflows/wayback-save.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# Results and replay evidence are append-only writes to main. Serializing the
# worker prevents concurrent runs from generating the same replay paths and
# colliding during the persistence rebase. Scheduled runs retry requests left
# pending by infrastructure failures without rewriting their identity.
concurrency:
  group: wayback-preservation-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  wayback-save:
    name: Drain OKF Wayback queue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate governed Wayback OKF namespace before preservation
        run: uv run scripts/wayback/check.py

      - name: Drain pending archive-request concepts
        shell: bash
        run: |
          set -euo pipefail

          # The queue is semantic: every archive-request without a terminal
          # archive-result is pending. Always recompute that queue instead of
          # limiting work to files changed by this push. Event-scoped draining
          # can orphan an older request when a previous run fails before it
          # reaches the Internet Archive and a later push changes a different
          # request. The hourly trigger retries transient infrastructure
          # failures without creating a duplicate request.
          echo "Draining the full pending Wayback queue."
          uv run scripts/wayback/drain.py | tee /tmp/wayback-drain-output.txt
          grep '^knowledge/wayback/results/.*\.md$' /tmp/wayback-drain-output.txt \
            > /tmp/wayback-new-results.txt || true

      - name: Validate governed Wayback OKF namespace after preservation
        run: uv run scripts/wayback/check.py

      - name: Materialize auditable replay evidence
        id: replay
        continue-on-error: true
        # Fresh terminal results are always prioritized. Up to two recent
        # archived results whose replay is still incomplete are also retried
        # per run. Replay is enrichment: a failure here must never discard a
        # terminal archive-result already obtained from the Internet Archive.
        run: >-
          uv run scripts/wayback/replay.py
          --result-path-file /tmp/wayback-new-results.txt
          --backfill-limit 2

      - name: Decode stored text replay transport
        id: text_replay
        continue-on-error: true
        run: uv run scripts/wayback/text_replay.py

      - name: Compare PDF replay text with live source
        id: pdf_equivalence
        continue-on-error: true
        run: uv run scripts/wayback/pdf_equivalence.py

      - name: Persist archive results and replay evidence
        if: always()
        run: |
          set -euo pipefail
          git add knowledge/wayback/results raw/wayback/replays
          if git diff --cached --quiet -- knowledge/wayback/results raw/wayback/replays; then
            echo "No terminal Wayback results or new replay evidence produced."
            exit 0
          fi
          git config user.name "O Vigia Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(wayback): persist archive evidence from run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Archive evidence push raced with main; retrying ($attempt/3)." >&2
            sleep $((attempt * 2))
          done
          echo "Could not persist Wayback evidence after 3 rebases." >&2
          exit 1

      - name: Surface replay enrichment failures
        if: >-
          always() &&
          (steps.replay.outcome == 'failure' ||
           steps.text_replay.outcome == 'failure' ||
           steps.pdf_equivalence.outcome == 'failure')
        run: |
          echo "Terminal Wayback results were persisted, but replay enrichment failed." >&2
          exit 1
