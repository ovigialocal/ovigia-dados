name: Wayback Machine Preservation

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL única para salvar no Wayback Machine"
        required: false
        type: string
      url_file:
        description: "Arquivo versionado com URLs públicas, uma por linha"
        required: false
        type: string
  workflow_call:
    inputs:
      url:
        required: false
        type: string
      url_file:
        required: false
        type: string

permissions:
  contents: write

jobs:
  wayback-save:
    name: Save to Wayback Machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Define immutable evidence path
        run: echo "WAYBACK_REPORT=raw/wayback/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" >> "$GITHUB_ENV"

      - name: Archive URL
        if: ${{ inputs.url != '' }}
        run: uv run scripts/wayback/save.py --url "${{ inputs.url }}" --output-report "$WAYBACK_REPORT"

      - name: Archive URL file
        if: ${{ inputs.url == '' && inputs.url_file != '' }}
        run: uv run scripts/wayback/save.py --file "${{ inputs.url_file }}" --output-report "$WAYBACK_REPORT"

      - name: Require an input
        if: ${{ inputs.url == '' && inputs.url_file == '' }}
        run: |
          echo "Provide url or url_file" >&2
          exit 2

      - name: Persist raw preservation evidence
        if: always()
        run: |
          if [ ! -f "$WAYBACK_REPORT" ]; then
            echo "No preservation report produced."
            exit 0
          fi
          git config user.name "O Vigia Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$WAYBACK_REPORT"
          git commit -m "chore(wayback): preserve run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin HEAD:main

      - name: Upload preservation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayback-preservation-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.WAYBACK_REPORT }}
          if-no-files-found: ignore
