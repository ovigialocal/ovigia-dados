name: Sports Official Sources

on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/ovigia_dados/sports/official_sources.py'
      - 'scripts/sports/collect_official_schedule.py'
      - 'tests/sports/test_official_sources.py'
      - '.github/workflows/sports-official-sources.yml'

permissions:
  contents: write

concurrency:
  group: sports-official-sources-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  collect:
    name: Agenda oficial e fechamento pós-jogo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Collect FFER Rondoniense schedule and results
        run: |
          SNAP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          echo "SNAP=$SNAP" >> "$GITHUB_ENV"
          uv run python scripts/sports/collect_official_schedule.py \
            --snapshot-id "$SNAP" \
            --url 'https://ffer.com.br/Publicacao.aspx?id=640220' \
            --competition 'Rondoniense' \
            --season 2026 \
            --output datasets/sports/current/rondoniense-2026.csv \
            --health-output datasets/sports/quality/ffer-rondoniense-source.csv \
            --raw-output data/output/sports-official/ffer-rondoniense-2026.html \
            --leads-dir knowledge/sports/leads \
            --allow-source-unavailable

      - name: Validate sports knowledge
        run: |
          uv run okf-parser check knowledge/sports/registry
          if [ -d knowledge/sports/leads ]; then
            uv run okf-parser check knowledge/sports/leads
          else
            echo "Nenhum lead esportivo materializado ainda; bootstrap válido."
          fi

      - name: Persist changed agenda, source health and new post-match leads
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "O Vigia Sports Data Bot"
          git config user.email "actions@users.noreply.github.com"
          for path in \
            datasets/sports/current/rondoniense-2026.csv \
            datasets/sports/quality/ffer-rondoniense-source.csv \
            knowledge/sports/leads
          do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "Agenda, disponibilidade da fonte e leads sem mudança material."
            exit 0
          fi
          git commit -m "data(sports): update official agenda ${SNAP}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload raw official observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sports-official-${{ env.SNAP || 'failed' }}
          path: |
            data/output/sports-official/
            datasets/sports/current/rondoniense-2026.csv
            datasets/sports/quality/ffer-rondoniense-source.csv
          if-no-files-found: warn
          retention-days: 30
