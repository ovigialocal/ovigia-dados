name: Sports (API-Football) Pipeline & Detectors

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: 'Identificador do snapshot (ex: 2026-09-02)'
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  sports-etl:
    name: Sports Acquisition, Normalization & Detectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Validate authored sports registry
        run: uv run okf-parser check knowledge/sports/registry

      - name: Run Sports Pipeline
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_KEYS: ${{ secrets.API_FOOTBALL_KEYS }}
        run: |
          SNAP="${{ inputs.snapshot_id }}"
          if [ -z "$SNAP" ]; then
            SNAP=$(date -u +%Y-%m-%d)
          fi
          echo "SNAP=$SNAP" >> "$GITHUB_ENV"
          uv run scripts/sports/run_sports_pipeline.py \
            --snapshot-id "$SNAP" \
            --output-dir data/output/sports \
            --leads-dir knowledge/sports/leads

      - name: Validate persistent sports leads
        run: uv run okf-parser check knowledge/sports/leads

      - name: Persist new sports leads and raw payloads
        run: |
          git config user.name "O Vigia Sports Data Bot"
          git config user.email "actions@users.noreply.github.com"
          # Os payloads brutos entram junto: um time novo no registry é
          # buscado uma vez, e sem commit ele seria rebuscado todo dia.
          git add knowledge/sports/leads raw/sports
          if git diff --cached --quiet; then
            echo "Nenhum sinal esportivo novo para persistir."
            exit 0
          fi
          git commit -m "data(sports): materialize signals ${SNAP}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload Sports Parquet Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sports-snapshot-artifacts
          path: data/output/sports/
          retention-days: 30

      - name: Pack raw API-Football payloads
        run: |
          # Os payloads brutos viajam junto do snapshot para que repórteres
          # usem o dado sem chave e sem consultar a API.
          if [ -d raw/sports/api-football ]; then
            zip -qr data/output/sports/raw-api-football.zip raw/sports/api-football
          fi

      - name: Publish Sports Snapshot to Internet Archive
        if: env.IA_ACCESS_KEY != '' && env.IA_SECRET_KEY != ''
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          echo "Publicando snapshot esportivo no Internet Archive..."
          uv run scripts/archive/publish_snapshot.py \
            --manifest data/output/sports/manifest.json \
            --parquet data/output/sports/fixtures.parquet \
            --dictionary datasets/sports/dictionary.md \
            --catalog datasets/sports/catalog.sql \
            --raw data/output/sports/raw-api-football.zip
