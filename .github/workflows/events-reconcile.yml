name: City Events (Reconcile)

on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: city-events-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile public city events
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Reconcile latest event observations
        run: uv run scripts/events/reconcile_city_events.py

      - name: Validate reconciliation concepts
        run: |
          uv run okf-parser check specs
          if [ -d knowledge/events/reconciliations ]; then
            uv run okf-parser check knowledge/events/reconciliations
          fi
          if [ -d knowledge/events/entities ]; then
            uv run okf-parser check knowledge/events/entities
          fi

      - name: Persist reconciliation evidence
        run: |
          git config user.name "O Vigia Events Bot"
          git config user.email "actions@users.noreply.github.com"
          git add knowledge/events
          if git diff --cached --quiet; then
            echo "Nenhuma nova reconciliação material."
            exit 0
          fi
          git commit -m "data(events): reconcile city event sources"
          git pull --rebase origin main
          git push origin HEAD:main
