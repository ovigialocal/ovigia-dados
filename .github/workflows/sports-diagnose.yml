name: Sports API-Football Diagnose (temporary)

# Disparo manual apenas. Rodar a cada push gastava ~9 requisições de busca
# por commit em um orçamento diário de 100, o que sozinho explica dias
# inteiros sem cota para o pipeline.
on:
  workflow_dispatch:
    inputs:
      search_entities:
        description: 'Também buscar IDs de times por nome (gasta ~7 requisições)'
        required: false
        default: 'false'
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    name: Probe API-Football plan, coverage and real entity IDs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Probe API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_KEYS: ${{ secrets.API_FOOTBALL_KEYS }}
          PYTHONUNBUFFERED: "1"
          SEARCH_ENTITIES: ${{ inputs.search_entities }}
        run: uv run scripts/sports/diagnose_api_football.py
