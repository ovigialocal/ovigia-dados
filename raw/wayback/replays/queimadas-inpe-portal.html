<body class="preload">
  <div id="preloader"></div>
  <h1 class="page-title">
    Portal do Programa Queimadas do
    <abbr class="page-title__abbr" title="Instituto Nacional de Pesquisas Espaciais">Inpe</abbr>
  </h1>

  <main class="main-content">
    <!-- ======== SISTEMAS ======== -->
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-auto tile-start-section">
          <h1 class="display-6">Sistemas</h1>
        </div>
      </div>
      <div class="row g-4" data-yml-section="sistemas" data-card-col="col-12 col-sm-6 col-lg-4 d-flex">
      </div>
    </div>

    <!-- ======== DADOS PARA DOWNLOAD ======== -->
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-auto tile-start-section">
          <h1 class="display-6">Dados para download</h1>
        </div>
      </div>
      <div class="row g-4" data-yml-section="downloads" data-card-col="col-12 col-sm-6 col-lg-4 d-flex">
      </div>
    </div>

    <!-- ======== RELATÓRIOS ======== -->
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-auto tile-start-section">
          <h1 class="display-6">Relatórios</h1>
        </div>
      </div>
      <div class="row g-4" data-yml-section="relatorios" data-card-col="col-12 col-sm-6 col-lg-4 d-flex">
      </div>
    </div>

    <!-- ======== INFORMAÇÕES DO PROGRAMA ======== -->
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-auto tile-start-section">
          <h1 class="display-6">Informações do Programa</h1>
        </div>
      </div>
      <div class="row g-4" data-yml-section="informacoes" data-card-col="col-12 col-md-6 col-lg-4 d-flex">
      </div>
    </div>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

  <script src="assets/js/portal-yaml.js" data-yaml="config/portal.yaml" defer></script>

  <script>
    function hidePreloader() {
      const pre = document.getElementById('preloader');
      if (pre) pre.style.display = 'none';
      document.body.classList.remove('preload');
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(hidePreloader, 1000);
    });

    setTimeout(hidePreloader, 2000);
  </script>
</body>
