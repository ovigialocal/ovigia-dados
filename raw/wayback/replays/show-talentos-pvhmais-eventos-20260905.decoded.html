    <script>
      (function () {
        // Token e regex vêm do concern por interpolação, para que as duas
        // cópias da heurística não possam divergir em silêncio.
        var NATIVE_APP_TOKEN = 'ConectaCidadesApp';
        var ANDROID_WEBVIEW_RE = /;\s*wv[;)]/;
        var DISMISSED_KEY = 'app-banner-dismissed-32';

        // WebView do Android se identifica com o token "wv" no User-Agent. Mesma
        // heurística do NativeAppWebviewDetection; repetida aqui como defesa em
        // profundidade para o caso de a página vir de cache servido fora do app.
        // No iOS não há marcador equivalente — lá dependemos do sinal explícito que
        // o app envia (header X-Conecta-App ou token no User-Agent).
        function isNativeAppWebView() {
          return ANDROID_WEBVIEW_RE.test(navigator.userAgent) ||
                 navigator.userAgent.includes(NATIVE_APP_TOKEN);
        }

        // No iOS, todo navegador alternativo carimba um token próprio no User-Agent
        // (CriOS = Chrome, FxiOS = Firefox, EdgiOS = Edge, OPiOS = Opera, GSA = app
        // do Google). O Safari é o único que não se marca — e é justamente onde o
        // Smart App Banner nativo da Apple já convida, então esta faixa se cala lá
        // para não duplicar o convite.
        function isIOSSafari() {
          const ua = navigator.userAgent;
          return /iPhone|iPad|iPod/i.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA/i.test(ua);
        }

        // Link da loja da plataforma em uso. null quando o contrato não cadastrou a
        // loja daquele sistema, e aí não há convite a fazer.
        function storeUrlForPlatform(banner) {
          const ua = navigator.userAgent;
          if (/Android/i.test(ua)) return banner.dataset.androidUrl || null;
          if (/iPhone|iPad|iPod/i.test(ua)) return banner.dataset.iosUrl || null;
          return null;
        }

        // --app-banner-height é a altura da faixa enquanto ela está visível, e 0
        // depois de fechada. O header fixo da SPA lê essa variável para saber quanto
        // descer, e o spacer do conteúdo soma as duas alturas. A faixa só sai pelo
        // "×": some com a rolagem faria o spacer encolher no meio do scroll e todo
        // o conteúdo saltaria para cima nesse instante.
        function setBannerHeightVar(height) {
          document.documentElement.style.setProperty('--app-banner-height', `${height}px`);
        }

        // Mantém a altura em sincronia se a faixa mudar de tamanho (rotação de
        // tela, quebra de linha do nome do município, fonte maior).
        function observeBannerHeight(banner) {
          setBannerHeightVar(banner.offsetHeight);

          if (typeof ResizeObserver === 'undefined') return;
          new ResizeObserver(function () {
            if (banner.style.display !== 'none') setBannerHeightVar(banner.offsetHeight);
          }).observe(banner);
        }

        function hideAppBanner(banner) {
          banner.style.display = 'none';
          setBannerHeightVar(0);
        }

        function showAppInstallBanner() {
          const banner = document.getElementById('app-install-banner');
          if (!banner) return;

          // Dentro do app não se convida a instalar o app; no Safari o convite
          // nativo da Apple já cumpre esse papel.
          if (isNativeAppWebView() || isIOSSafari()) return;

          const storeUrl = storeUrlForPlatform(banner);
          if (!storeUrl) return;

          // Check if user previously dismissed the banner
          const dismissed = localStorage.getItem(DISMISSED_KEY);
          const dismissedTime = dismissed ? parseInt(dismissed) : 0;
          const oneDayAgo = Date.now() - (24 * 60 * 60 * 1000);
          if (dismissedTime >= oneDayAgo) return;

          banner.querySelector('.app-install-banner__install').href = storeUrl;
          banner.style.display = 'block';
          observeBannerHeight(banner);
        }

        function closeAppBanner() {
          const banner = document.getElementById('app-install-banner');
          if (banner) {
            hideAppBanner(banner);

            // Fechar no "×" é recusa explícita: guarda por 24h.
            localStorage.setItem(DISMISSED_KEY, Date.now().toString());
          }
        }

        // Quem chegou por um Universal Link e acabou na web é justamente quem tenta
        // usar o app e não conseguiu abrir — reforça o convite depois de um instante.
        // showAppInstallBanner() já respeita plataforma, WebView e dismissal.
        function detectUniversalLinkFailure() {
          const isFromQRCode = document.referrer.includes('/app/');
          const isMobile = /Mobile|Android|iPhone|iPad/i.test(navigator.userAgent);

          if (isFromQRCode && isMobile) {
            setTimeout(showAppInstallBanner, 1000);
          }
        }

        // O "×" é ligado por listener, e não por onclick no markup, para que
        // nenhuma das funções acima precise virar global.
        const closeButton = document.querySelector('#app-install-banner .app-install-banner__close');
        if (closeButton) closeButton.addEventListener('click', closeAppBanner);

        // Executa imediatamente (o script vem logo após a faixa no <body>, então o
        // elemento já existe) para que --app-banner-height esteja definida antes do
        // React montar — senão o header nasce em top: 0 e "pula" ao descer.
        showAppInstallBanner();

        document.addEventListener('DOMContentLoaded', function() {
          detectUniversalLinkFailure();
        });
      })();
    </script>

    <div id="root" data-parameters="{&quot;flash&quot;:{&quot;notice&quot;:null,&quot;alert&quot;:null},&quot;currentCitizen&quot;:null,&quot;contract&quot;:{&quot;contract&quot;:{&quot;id&quot;:32,&quot;name&quot;:&quot;Porto Velho&quot;,&quot;slogan&quot;:&quot;&quot;,&quot;primary_bg_color&quot;:&quot;#204394&quot;,&quot;primary_fg_color&quot;:&quot;#ffffff&quot;,&quot;highlight_color_for_white_bg&quot;:&quot;#58ad15&quot;,&quot;map_center&quot;:[-8.762400223174549,-63.867481281644],&quot;login_mode&quot;:&quot;govbr_production&quot;,&quot;chatbot_link&quot;:&quot;&quot;,&quot;chatbot_token&quot;:&quot;&quot;,&quot;link_app_android&quot;:&quot;https://play.google.com/store/apps/details?id=br.com.rdmapps.conectaPortoVelhoAndroid&quot;,&quot;link_app_apple&quot;:&quot;https://apps.apple.com/br/app/pvh/id6759566815&quot;,&quot;welcome_message&quot;:&quot;&quot;,&quot;social_links&quot;:[],&quot;optional_modules&quot;:[&quot;agent_ai&quot;,&quot;vlibras&quot;,&quot;image_ai&quot;,&quot;view_reviews&quot;,&quot;qr_codes&quot;,&quot;admin_form_submissions&quot;,&quot;form_web&quot;,&quot;schedule&quot;,&quot;global_notifications&quot;,&quot;registrations&quot;,&quot;tags&quot;,&quot;wallets&quot;,&quot;jobs&quot;,&quot;&quot;],&quot;form_acceptance_text&quot;:&quot;&quot;,&quot;allow_citizen_event_creation&quot;:true,&quot;show_event_creation_link&quot;:true,&quot;android_package_name&quot;:&quot;br.com.rdmapps.conectaPortoVelhoAndroid&quot;,&quot;custom_tabs&quot;:[],&quot;message_service_interval&quot;:null,&quot;android_min_version&quot;:&quot;&quot;,&quot;ios_min_version&quot;:&quot;&quot;,&quot;whatsapp_verification_enabled&quot;:false,&quot;whatsapp_redirect_number&quot;:&quot;69984732524&quot;,&quot;whatsapp_redirect_message&quot;:&quot;&quot;,&quot;require_profile_completion&quot;:false,&quot;required_profile_fields&quot;:[],&quot;show_loading_circle&quot;:false,&quot;domain&quot;:&quot;pvhmais.portovelho.ro.gov.br&quot;,&quot;privacy_policy_body&quot;:&quot;\u003ch1\u003ePolítica de Privacidade — Conecta Porto Velho\u003c/h1\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003ch1\u003e\u003cstrong\u003e1. Introdução\u0026nbsp;\u003c/strong\u003e\u003c/h1\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eA sua privacidade é importante para nós. Esta Política de Privacidade descreve como coletamos, utilizamos e protegemos os dados dos usuários do aplicativo \u003cstrong\u003eConecta Porto Velho\u003c/strong\u003e, desenvolvido para facilitar o acesso do cidadão — residente ou visitante — aos serviços, eventos e atrativos da cidade de \u003cstrong\u003ePorto Velho (RO)\u003c/strong\u003e.\u003cbr\u003eAo utilizar o aplicativo, você concorda com os termos desta política.\u003cbr\u003e\u003cbr\u003e\u003c/div\u003e\u003ch1\u003e2. Dados Coletados\u003c/h1\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eO \u003cstrong\u003eConecta Porto Velho\u003c/strong\u003e coleta dados \u003cstrong\u003esomente quando o usuário realiza login utilizando a plataforma gov.br\u003c/strong\u003e. O uso do aplicativo pode ser feito de forma anônima, mas, ao realizar o login, os seguintes dados podem ser coletados e armazenados:\u003c/div\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eDados de identificação\u003c/strong\u003e: nome completo e CPF;\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eDados de contato\u003c/strong\u003e: e-mail e telefone;\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eDados complementares (opcional)\u003c/strong\u003e: endereço e nome social.\u003c/li\u003e\u003c/ul\u003e\u003cdiv\u003eEsses dados são utilizados exclusivamente para identificação do usuário dentro dos serviços oferecidos pela Prefeitura de \u003cstrong\u003ePorto Velho\u003c/strong\u003e.\u003cbr\u003e\u003cbr\u003e\u003c/div\u003e\u003ch1\u003e3. Forma de Coleta\u003c/h1\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eOs dados são coletados por meio de \u003cstrong\u003eformulário de login\u003c/strong\u003e via a integração com a \u003cstrong\u003eplataforma gov.br\u003c/strong\u003e. O preenchimento de dados complementares (como endereço e nome social) é opcional e feito diretamente no app.\u003cbr\u003e\u003cbr\u003e\u003c/div\u003e\u003ch1\u003e4. Compartilhamento de Dados\u003c/h1\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003e\u003cstrong\u003eOs dados não são compartilhados com terceiros.\u003c/strong\u003e\u003cbr\u003eApenas a \u003cstrong\u003ePrefeitura de Porto Velho\u003c/strong\u003e tem acesso às informações fornecidas pelos usuários. Não utilizamos seus dados para fins comerciais, publicitários ou analíticos externos.\u003cbr\u003e\u003cbr\u003e\u003c/div\u003e\u003ch1\u003e5. Uso de Cookies\u003c/h1\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eO Conecta \u003cstrong\u003ePorto Velho\u003c/strong\u003e utiliza cookies estritamente necessários para manter a \u003cstrong\u003esessão ativa do usuário logado\u003c/strong\u003e.\u003cbr\u003eEsses cookies \u003cstrong\u003enão são utilizados para rastreamento, publicidade ou análise de comportamento\u003c/strong\u003e.\u003cbr\u003e\u003cbr\u003e\u003c/div\u003e\u003ch1\u003e6. Integrações com Terceiros\u003c/h1\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eO aplicativo se integra apenas com o serviço de \u003cstrong\u003elogin da plataforma gov.br\u003c/strong\u003e, com a finalidade exclusiva de autenticar usuários e garantir segurança na identificação.\u003cbr\u003e\u003cbr\u003e\u003c/div\u003e\u003ch1\u003e7. Exclusão de Conta\u003c/h1\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eNo momento, o aplicativo \u003cstrong\u003enão oferece uma funcionalidade para exclusão de conta diretamente pelo usuário\u003c/strong\u003e.\u003cbr\u003eCaso deseje mais informações sobre seus dados pessoais ou solicitar alguma ação relacionada a eles, entre em contato conosco.\u003cbr\u003e\u003cbr\u003e\u003c/div\u003e\u003ch1\u003e8. Contato\u003c/h1\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003ePara quaisquer dúvidas, solicitações ou reclamações relacionadas à privacidade de seus dados, entre em contato com: \u003cstrong\u003econtato@rdmapps.com.br\u003cbr\u003e\u003c/strong\u003e\u003cbr\u003e\u003c/div\u003e\u003ch1\u003e9. Localização da Empresa Responsável\u003c/h1\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eA empresa responsável pelo aplicativo \u003cstrong\u003eConecta Porto Velho \u003c/strong\u003eestá localizada em \u003cstrong\u003eRecife, Pernambuco, Brasil\u003c/strong\u003e, e cumpre com a \u003cstrong\u003eLei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018)\u003c/strong\u003e.\u003cbr\u003e\u003cbr\u003e\u003c/div\u003e\u003ch1\u003e10. Atualizações\u003c/h1\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eEsta Política de Privacidade pode ser atualizada periodicamente. A versão mais recente estará sempre disponível no aplicativo. Recomendamos que os usuários revisem esta política com frequência para se manterem informados.\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e&quot;,&quot;about_body&quot;:&quot;\u003ch1\u003eSobre o Jaboatão Fácil\u003c/h1\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eO \u003cstrong\u003eConecta Porto Velho\u003c/strong\u003e é o aplicativo oficial desenvolvido para aproximar cidadãos — residentes ou visitantes — da cidade de \u003cstrong\u003ePorto Velho\u003c/strong\u003e (RO), oferecendo acesso rápido e prático a serviços públicos, eventos, notícias e atrativos locais.\u003cbr\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eNosso objetivo é facilitar a vida de quem vive e circula por\u003cstrong\u003e Porto Velho\u003c/strong\u003e, promovendo cidadania, inclusão e transparência. Com o app, você pode explorar as novidades da cidade, participar de eventos, consultar serviços da prefeitura e acompanhar tudo o que \u003cstrong\u003ePorto Velho\u003c/strong\u003e tem de melhor.\u003cbr\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eO \u003cstrong\u003eConecta Porto Velho\u003c/strong\u003e é uma iniciativa da Prefeitura de\u003cstrong\u003e Porto Velho\u003c/strong\u003e, com tecnologia da Roadmapps, e utiliza autenticação segura via \u003cstrong\u003eplataforma gov.br\u003c/strong\u003e, garantindo confiabilidade no acesso aos serviços personalizados.\u003cbr\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eEstamos em constante evolução para tornar a experiência do cidadão cada vez mais simples, útil e conectada com o que a cidade oferece.\u003cbr\u003e\u003cbr\u003eAlgumas das imagens presentes nesse aplicativo podem ter sido geradas por I.A. (Inteligência Artificial) para melhorar a experiência visual e estética.\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e&quot;,&quot;cover_url&quot;:&quot;https://public.conectacidades.app/pvhmais_portovelho_ro_gov_br/zjulzlrwjg3axh43sljj7e97ayoj&quot;,&quot;cover_mobile_url&quot;:&quot;https://public.conectacidades.app/pvhmais_portovelho_ro_gov_br/zjulzlrwjg3axh43sljj7e97ayoj&quot;,&quot;cover_web_url&quot;:&quot;https://public.conectacidades.app/pvhmais_portovelho_ro_gov_br/p5c541xgyprr50kihkz4dv2ylvu6&quot;,&quot;logo_url&quot;:&quot;https://public.conectacidades.app/pvhmais_portovelho_ro_gov_br/sfp6q0on7apccap78ocpw1cgiimm&quot;,&quot;horizontal_logo_url&quot;:null,&quot;jobs_logo_url&quot;:null,&quot;jobs_cover_url&quot;:null,&quot;favicon_url&quot;:&quot;https://public.conectacidades.app/pvhmais_portovelho_ro_gov_br/d622r2ra7b0x848n3t40cee383gv&quot;,&quot;default_pin_svg&quot;:&quot;\u003csvg width=\&quot;16\&quot; height=\&quot;16\&quot; viewBox=\&quot;0 0 16 16\&quot; fill=\&quot;#204394\&quot; xmlns=\&quot;http://www.w3.org/2000/svg\&quot;\u003e\n  \u00
