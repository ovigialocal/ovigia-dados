[project]
name = "ovigia-dados"
version = "0.1.0"
description = "Infraestrutura pública de datasets, snapshots canônicos no Internet Archive, catálogo SQL e detectores determinísticos do O Vigia."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "O Vigia", email = "contato@ovigia.local" }
]
dependencies = [
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
    "internetarchive>=4.0.0",
    "requests>=2.31.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "okf-parser==0.45.2",
]
